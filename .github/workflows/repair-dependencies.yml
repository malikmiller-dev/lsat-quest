name: Repair and validate dependency lockfile
on:
  push:
    branches: [feat/first-learning-quest]
    paths: [.github/workflows/repair-dependencies.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dependency-lockfile-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'malikmiller-dev/lsat-quest' && github.ref == 'refs/heads/feat/first-learning-quest'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Use the npm version that produced the existing lockfile
        run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Install reviewed compatible fixes and refresh vulnerable transitive packages
        run: |
          npm install --save-dev --save-exact vite@7.3.7 vitest@4.1.12
          npm audit fix --ignore-scripts
          npm run audit:dependencies
      - name: Preserve the audited lockfile on the draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: update build and test dependencies for published advisories'
            git push origin HEAD:refs/heads/feat/first-learning-quest
          fi
          echo "Testing source commit: $(git rev-parse HEAD)"
      - run: npm run check
      - run: npm run format:check
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:e2e
