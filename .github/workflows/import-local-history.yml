name: Import preserved local history
on:
  push:
    branches: [main]
    paths: [.source-import/history.bundle]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: initial-history-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'malikmiller-dev/lsat-quest'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify and import original branches without rewriting commits
        shell: bash
        run: |
          set -euo pipefail
          echo '095bc654d04bb98cdd58e71943bd5a516e0301204c3f342afb855b4fd292a3d1  .source-import/history.bundle' | sha256sum --check
          git bundle verify .source-import/history.bundle
          git fetch .source-import/history.bundle refs/heads/main:refs/remotes/local-import/main refs/heads/feat/first-learning-quest:refs/remotes/local-import/feature
          test "$(git rev-parse refs/remotes/local-import/main)" = b8a920f6bb0cfbc7b10353331ea1f1bcb03f609f
          test "$(git rev-parse refs/remotes/local-import/feature)" = 74585cabcb021fd210aebc25a60d30e6086782fa
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          main_tree=$(git rev-parse refs/remotes/local-import/main^{tree})
          feature_tree=$(git rev-parse refs/remotes/local-import/feature^{tree})
          main_commit=$(git commit-tree "$main_tree" -p "$GITHUB_SHA" -p refs/remotes/local-import/main -m 'chore: import preserved foundation history')
          feature_commit=$(git commit-tree "$feature_tree" -p "$main_commit" -p refs/remotes/local-import/feature -m 'chore: import preserved first quest history')
          git merge-base --is-ancestor "$GITHUB_SHA" "$main_commit"
          git merge-base --is-ancestor refs/remotes/local-import/main "$main_commit"
          git merge-base --is-ancestor refs/remotes/local-import/feature "$feature_commit"
          git push --atomic origin "$main_commit:refs/heads/main" "$feature_commit:refs/heads/feat/first-learning-quest"
          echo "Imported main: $main_commit"
          echo "Imported feature: $feature_commit"
